# Configuração da hospedagem no Render.
#
# Com este arquivo no repositório, o Render monta o serviço sozinho: basta
# apontar para o repositório e preencher as variáveis marcadas abaixo.
#
# O banco de dados fica FORA do Render, no Neon (PostgreSQL gratuito e sem
# prazo de validade). É isso que garante que atualizar o código, reiniciar o
# serviço ou o site hibernar não apague nenhum pedido.

services:
  - type: web
    name: verllog
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120

    envVars:
      # Cole aqui a connection string do Neon (painel do Render, não no código).
      - key: DATABASE_URL
        sync: false

      # Login do painel administrativo. Defina no painel do Render.
      - key: ADMIN_USUARIO
        sync: false
      - key: ADMIN_SENHA
        sync: false

      # Chave de sessão, gerada pelo Render e nunca exposta no repositório.
      - key: SECRET_KEY
        generateValue: true

      # Sem isso o servidor roda em UTC e as datas do rastreio saem com
      # algumas horas de diferença do horário do Brasil.
      - key: TZ
        value: America/Manaus

      - key: PYTHON_VERSION
        value: "3.12.10"
